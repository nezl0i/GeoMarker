<!-- Модальное окно со списком всех меток -->
<div id="allMarkersModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2001; justify-content: center; align-items: center;">
    <div style="background: rgba(10,10,10,0.98); padding: 30px; border-radius: 8px; max-width: 600px; width: 95%; border: 1px solid rgba(0,255,65,0.2); box-shadow: 0 0 60px rgba(0,0,0,0.9); color: #00ff41; max-height: 90vh; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="color: #00ff41; text-shadow: 0 0 30px rgba(0,255,65,0.3); font-family: 'Courier New', monospace;">📍 Все метки</h3>
            <button id="allMarkersCloseBtn" style="padding: 8px 16px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace;">✖</button>
        </div>
        <div id="allMarkersList" style="flex: 1; overflow-y: auto; max-height: 60vh;">
            <p style="color: rgba(0,255,65,0.4); text-align: center; padding: 20px; font-family: 'Courier New', monospace;">Загрузка...</p>
        </div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button id="allMarkersZoomBtn" style="flex: 1; padding: 10px; background: rgba(0,150,255,0.1); color: #00ccff; border: 1px solid rgba(0,150,255,0.3); border-radius: 4px; cursor: pointer; font-weight: 600; font-family: 'Courier New', monospace;">🔍 Показать все на карте</button>
            <button id="allMarkersDeleteAllBtn" style="flex: 1; padding: 10px; background: rgba(255,0,0,0.1); color: #ff4444; border: 1px solid rgba(255,0,0,0.3); border-radius: 4px; cursor: pointer; font-weight: 600; font-family: 'Courier New', monospace;">🗑️ Удалить все</button>
        </div>
    </div>
</div>
